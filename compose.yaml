services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finsig
      POSTGRES_USER: finsig
      POSTGRES_PASSWORD: finsig_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - finsig_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finsig -d finsig']
      interval: 2s
      timeout: 2s
      retries: 20

  flyway:
    image: flyway/flyway:13.12.1-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/finsig
      FLYWAY_USER: finsig
      FLYWAY_PASSWORD: finsig_dev
      FLYWAY_SCHEMAS: public
      FLYWAY_TABLE: flyway_schema_history
      FLYWAY_VALIDATE_MIGRATION_NAMING: 'true'
      FLYWAY_CLEAN_DISABLED: 'true'
      FLYWAY_CONNECT_RETRIES: '20'
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./db/migrations:/flyway/sql:ro
      - ./db/flyway.conf:/flyway/conf/flyway.conf:ro
    entrypoint: ['flyway']

volumes:
  finsig_pg:
